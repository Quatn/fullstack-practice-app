services:
  mysql:
    image: 'mysql:8.4.7'
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysql", 
             "--host=localhost",
             "--user=${DB_USER}",
             "--password=${DB_PASSWORD}",
             "--execute=USE ${DB_NAME}"]
      interval: ${DB_HEALTHCHECK_INTERVAL}
      timeout: ${DB_HEALTHCHECK_TIMEOUT}
      retries: ${DB_HEALTHCHECK_RETRIES}

  api:
    build:
      context: ./BE
      dockerfile: Dockerfile
    image: demo-springboot-api:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WEB_URL: ${WEB_URL}
      API_URL: ${API_URL}
      TOKEN_EXPIRATION_SECONDS: ${TOKEN_EXPIRATION_SECONDS}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRATION_SECONDS: ${REFRESH_TOKEN_EXPIRATION_SECONDS}
    ports:
      - "4000:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "localhost:8080"]
      interval: ${API_HEALTHCHECK_INTERVAL}
      timeout: ${API_HEALTHCHECK_TIMEOUT}
      retries: ${API_HEALTHCHECK_RETRIES}

  web:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_API_URL: ${API_URL}
    image: demo-springboot-web:latest
    environment:
      WEB_URL: ${WEB_URL}
      API_URL: ${API_URL}
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

  # Should only be used as a job via `docker compose run --rm seed`, or as the full setup flow via `docker compose --profile full-flow up`
  # Remember to use `docker compose --profile full-flow down -v` to *CLEAN ALL DATABASE DATA* before using `docker compose --profile full-flow up` (because full-flow will seed the database from the ground up)
  seed:
    image: 'mysql:8.4.7'
    profiles: ['full-flow']
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./data/mysql:/data:ro
    restart: "no"
    command: >
      sh -ec "
        echo 'Seeding data...';
        mysql --host=mysql --user=${DB_USER} --password=${DB_PASSWORD} ${DB_NAME} < /data/01-data-seed.sql;
        echo 'Seed complete';
      "

volumes:
  db-data:
